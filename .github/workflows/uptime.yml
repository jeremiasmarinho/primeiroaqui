# Monitor de uptime FALLBACK: checa a producao 1x/hora. Se /api/health nao
# responder 200, o job falha e o GitHub notifica por e-mail o dono do repo.
#
# ATENCAO (20/08/2026): em repo PUBLICO Actions e gratuito; no instante em
# que o repo virar privado, cada execucao passa a cobrar 1 min da cota
# (2.000 min/mes no plano Free). O cron antigo de */15 consumiria ~2.880
# min/mes — mais que a cota inteira — e quando a cota acaba TODOS os
# workflows param em silencio. Por isso este job virou horario ANTES da
# mudanca de visibilidade.
#
# Este workflow e FALLBACK e tem dois limites conhecidos: o GitHub desativa
# schedules automaticamente apos 60 dias sem atividade no repo (o fallback
# morre em silencio), e `schedule` atrasa/pula execucoes sob carga. O monitor
# primario deve ser EXTERNO (UptimeRobot/Better Stack, tier free, intervalo
# de 1-5 min), configurado ANTES do cutover de DNS. Quando o externo estiver
# ativo, este workflow pode ser removido.
name: Uptime

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checar producao
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 https://primeiroaqui.koraforce.com.br/api/health || echo 000)
          echo "health: HTTP $code"
          [ "$code" = "200" ] || exit 1
