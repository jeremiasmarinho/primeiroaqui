# Monitor de uptime FALLBACK: checa a producao 1x/hora. Se /api/health nao
# responder 200, o job falha e o GitHub notifica por e-mail o dono do repo.
#
# ATENCAO (repo privado, 20/08/2026): cada execucao cobra 1 min da cota de
# Actions (2.000 min/mes no plano Free). O cron de */15 consumia ~2.880
# min/mes — mais que a cota inteira — e quando a cota acaba TODOS os
# workflows param em silencio. Por isso este job virou horario e o monitor
# primario deve ser EXTERNO (UptimeRobot/Better Stack, tier free, intervalo
# de 1-5 min): mais externo que o Actions, alerta por push e nao depende de
# cota. Quando o monitor externo estiver ativo, este workflow pode ser
# removido.
name: Uptime

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checar producao
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 https://primeiroaqui.koraforce.com.br/api/health || echo 000)
          echo "health: HTTP $code"
          [ "$code" = "200" ] || exit 1
